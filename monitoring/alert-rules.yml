groups:
  - name: payment-service
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[1m])) / sum(rate(http_requests_total[1m])) > 0.10
        for: 30s
        labels: { severity: critical, service: payment-service }
        annotations: { summary: "payment-service error rate above 10%" }

      - alert: DbPoolSaturated
        expr: db_pool_in_use >= db_pool_max
        for: 30s
        labels: { severity: warning, service: payment-service }
        annotations: { summary: "payment-service database pool is fully used" }

      - alert: ServiceDown
        expr: up{job="payment-service"} == 0
        for: 30s
        labels: { severity: critical, service: payment-service }
        annotations: { summary: "payment-service is not responding to scrapes" }

      - alert: HighMemory
        expr: process_resident_memory_bytes{job="payment-service"} > 200e6
        for: 30s
        labels: { severity: warning, service: payment-service }
        annotations: { summary: "payment-service memory above 200 MB" }
